name: Prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play track'
        required: false
        type: choice
        options: [internal, closed, open, production]
        default: internal

concurrency:
  group: prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    # Promotes the latest TestFlight build (uploaded by `dev.yml`) to App
    # Store review along with screenshots from `fastlane/screenshots/`. We
    # do NOT rebuild here — the build that's been on TestFlight is the one
    # that gets submitted, so QA on TestFlight reflects what's reviewed.
    #
    # Manual-trigger only: each App Store submission needs a fresh editable
    # version pre-created in App Store Connect, so it's not worth running
    # this on every push to main. Use `workflow_dispatch` when the ASC
    # version is ready, or submit through the ASC UI directly.
    name: iOS → App Store
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    env:
      CI: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_DISABLE_COLORS: '1'

      IOS_BUNDLE_ID: com.buzzkeepr.app
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}

      # App Store Connect API key — used by `deliver` to submit for review
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Submit iOS to App Store review
        timeout-minutes: 30
        run: bundle exec fastlane ios submit_review --verbose

  android:
    name: Android → Play
    runs-on: ubuntu-latest
    environment: production

    env:
      CI: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      EXPO_PUBLIC_APP_ENV: production
      EXPO_PUBLIC_GRAPHQL_URL: ${{ vars.EXPO_PUBLIC_GRAPHQL_URL_PRODUCTION }}
      EXPO_PUBLIC_AUTH_BASE_URL: ${{ vars.EXPO_PUBLIC_AUTH_BASE_URL_PRODUCTION }}
      EXPO_PUBLIC_AUTH_SCHEME: buzzkeepr
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
      EXPO_PUBLIC_REVENUECAT_API_KEY_IOS: ${{ vars.EXPO_PUBLIC_REVENUECAT_API_KEY_IOS_PRODUCTION }}
      EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID: ${{ vars.EXPO_PUBLIC_REVENUECAT_API_KEY_ANDROID_PRODUCTION }}
      EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID: ${{ vars.EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID_PRODUCTION }}
      EXPO_PUBLIC_PERSONA_ENVIRONMENT: ${{ vars.EXPO_PUBLIC_PERSONA_ENVIRONMENT_PRODUCTION }}
      EXPO_PUBLIC_PERSONA_TEMPLATE_ID: ${{ vars.EXPO_PUBLIC_PERSONA_TEMPLATE_ID_PRODUCTION }}
      EXPO_PUBLIC_TERMS_OF_USE_URL: ${{ vars.EXPO_PUBLIC_TERMS_OF_USE_URL }}
      EXPO_PUBLIC_PRIVACY_POLICY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_POLICY_URL }}
      EXPO_PUBLIC_CHILDREN_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_CHILDREN_PRIVACY_URL }}
      EXPO_PUBLIC_SUPPORT_URL: ${{ vars.EXPO_PUBLIC_SUPPORT_URL }}
      EXPO_PUBLIC_PARTNERSHIPS_URL: ${{ vars.EXPO_PUBLIC_PARTNERSHIPS_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}

      # Required by the @sentry/react-native/expo plugin's source-map upload
      # phase (sentry-cli reads SENTRY_ORG / SENTRY_PROJECT / SENTRY_AUTH_TOKEN
      # at build time). Missing these = the gradle SentryUpload task fails.
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      ANDROID_PACKAGE_NAME: com.buzzkeepr.app
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      PLAY_JSON_KEY_DATA: ${{ secrets.PLAY_JSON_KEY_DATA }}
      PLAY_TRACK: ${{ github.event_name == 'workflow_dispatch' && inputs.play_track || 'internal' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes from commit
        run: |
          DELIM="RELEASE_NOTES_$(date +%s%N)"
          {
            echo "RELEASE_NOTES<<$DELIM"
            git log -1 --pretty=format:'%s%n%n%b'
            echo
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - run: corepack enable
      - run: yarn install --immutable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Android (Fastlane)
        timeout-minutes: 60
        run: bundle exec fastlane android build --verbose

      - name: Upload Play
        timeout-minutes: 30
        run: bundle exec fastlane android play --verbose

      # Always upload the AAB — even when the Play upload step fails — so we
      # can manually upload the artifact to Play Console while debugging
      # supply/permission issues.
      - name: Upload AAB artifact
        if: always() && hashFiles('build/*.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/*.aab
          retention-days: 14
