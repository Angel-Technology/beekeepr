schema: ${EXPO_PUBLIC_GRAPHQL_URL}
generates:
  src/features/auth/graphql/generated/auth.generated.ts:
    config:
      scalars:
        DateTime: string
        UUID: string
      useTypeImports: true
    documents:
      - src/features/auth/graphql/**/*.graphql
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
  src/features/verification/graphql/generated/verification.generated.ts:
    config:
      scalars:
        DateTime: string
        UUID: string
      useTypeImports: true
    documents:
      - src/features/verification/graphql/**/*.graphql
    plugins:
      - typescript
      - typescript-operations
      - typed-document-node
